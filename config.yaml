
# JET FAN - PRELIMINARY DESIGN
# Thrust-Issues

# Design requirements
nominal_thrust_N: 1000.0
max_tip_diameter_m: 1.120

# Air properties
air_density_kg_m3: 1.2
dynamic_viscosity_Pa_s: 1.81e-5
air_temperature_K: 293.15
speed_of_sound_m_s: 343.0

# Operating assumptions
jet_velocity_m_s: 30.0
ambient_velocity_m_s: 0.0

# Preliminary efficiency assumptions
rotor_efficiency_initial: 0.80
work_done_factor: 1.0

# Geometric constraint
tip_diameter_fraction: 0.995

# Specific speed search
specific_speed_min: 2.5
specific_speed_max: 5.0
specific_speed_points: 51

# Preliminary Mach check
max_mach_number: 0.3

# Radial sections used for Mach screening
number_of_sections: 21
