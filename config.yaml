#===================================================================#
#INPUT E ASSUNZIONI
#===================================================================#

# Design requirements
nominal_thrust: 1000.0 #N
max_tip_diameter: 1.250 #m

# Air properties
air_density: 1.2 #kg/m3
dynamic_viscosity: 1.81e-5 #Pa/s
air_temperature: 293.15 #K
speed_of_sound: 343.0 #m/s

# Operating conditions
jet_velocity: 30.0 #m/s
ambient_velocity: 0 #m/s

# Initial efficiency assumptions
rotor_efficiency_initial: 0.80
work_done_factor: 1.0

# Tip clearance / diametro interno del condotto [-]
tip_clearance_ratio: 0.025

# Specific speed search
specific_speed_min: 3.0
specific_speed_max: 7.0
specific_speed_points: 81  # Passo di ricerca: 0.05

# Parametri riservati a controlli successivi:
max_mach_number: 0.3

# Numero di sezioni radiali per la verifica del Mach, inclusi Hub e Tip
number_of_sections: 21


#===================================================================#
# RENDIMENTI ELETTROMECCANICI (Ipotesi di Progetto)
#===================================================================#
mechanical_efficiency: 0.95    # Rendimento meccanico per attriti sui cuscinetti (95%)
motor_efficiency: 0.90         # Rendimento elettrico/magnetico del motore (90%)

#===================================================================#
# AIRFOIL DESIGN - NACA 65
#===================================================================#

airfoil:
  # Scelta del profilo
  profilo: NACA65
  tmax_c: 0.10
  sigma_prog: 1.0

  # Limiti aerodinamici
  D_max: 0.45
  de_haller_min: 0.72

  # Correlazioni di Lieblein
  Kti: 1.0
  Ksh: 1.0
  Kdelta_t: 1.0

  # Convergenza della curvatura
  epsilon_theta_deg: 0.001
  max_iter_theta: 100

  # Dimensionamento geometrico
  AR: 2.2

  # Ciclo esterno della solidita
  sigma_step: 0.02
  sigma_max: 1.14
  max_iter_sigma: 8